name: Build and test
on:
  push:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          # Runner images do not always ship an "iPhone 16" simulator, so use whichever iPhone exists.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = [d for group in json.load(sys.stdin)['devices'].items() if 'iOS' in group[0] for d in group[1]]
          phones = [d['udid'] for d in devices if d['name'].startswith('iPhone')]
          print(phones[-1] if phones else '')")
          status=0
          if [ -n "$UDID" ]; then
            xcodebuild -scheme Itadaki -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO test > build.log 2>&1 || status=$?
          else
            echo "::warning::No iOS simulator on this runner; building without running tests"
            xcodebuild -scheme Itadaki -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || status=$?
          fi
          grep -E "error|Test Suite|Executed|\*\* " build.log || tail -n 60 build.log
          exit "$status"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/itadaki-snapshots
          if-no-files-found: warn
      # The rendered screens are also kept in the repo, downscaled, so they can be
      # reviewed without downloading the artifact. Commits only when a screen changed.
      - name: Commit screenshots
        if: success() && github.event_name == 'push' && github.ref_name != 'main'
        run: |
          mkdir -p docs/screenshots
          for f in /tmp/itadaki-snapshots/*.png; do
            sips -s format jpeg -s formatOptions 80 -Z 1000 "$f" \
              --out "docs/screenshots/$(basename "${f%.png}").jpg" >/dev/null
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Update screenshots [skip ci]"
            git push || echo "::warning::Branch moved on; screenshots not pushed"
          fi
